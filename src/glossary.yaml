# Domain glossary for transcription prompting and post-processing correction.
# Tracked in git (unlike config.yaml) so it syncs across machines via `git pull`.
#
# categories: flattened into the Whisper/speaches `initial_prompt` (see glossary.py).
# static_map: exact-phrase replacements applied unconditionally after transcription.
# fuzzy: near-match correction against category terms, gated by context_triggers.

